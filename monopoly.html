<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Monopoly V4 Online</title>
<script src="/socket.io/socket.io.js"></script>

<style>
body{background:#0f172a;color:white;font-family:Arial;padding:10px}
h1{text-align:center;color:#facc15}

.menu{max-width:400px;margin:auto;background:#111827;padding:15px;border-radius:10px}
input,button{width:100%;padding:10px;margin-top:10px;border:none;border-radius:8px}

.game{display:none;gap:20px;justify-content:center}

.board{
width:700px;height:700px;
display:grid;
grid-template-columns:repeat(11,1fr);
grid-template-rows:repeat(11,1fr);
background:white;
}

.tile{border:1px solid black;font-size:10px;position:relative}

.player{width:10px;height:10px;border-radius:50%;position:absolute}

.sidebar{width:250px;background:#111827;padding:10px;border-radius:10px}

.log{height:200px;overflow:auto;font-size:12px}
</style>
</head>

<body>

<h1>🏙️ MONOPOLY V4</h1>

<div class="menu" id="menu">
<input id="username" placeholder="Pseudo">
<input id="room" placeholder="Room">
<button onclick="join()">Jouer</button>
</div>

<div class="game" id="game">

<div class="board" id="board"></div>

<div class="sidebar">
<button onclick="roll()">🎲 Lancer</button>
<button onclick="buy()">💰 Acheter</button>

<div id="players"></div>
<div class="log" id="log"></div>

</div>

</div>

<script>

const socket = io();

let roomId;
let state;

const board = document.getElementById("board");
const playersDiv = document.getElementById("players");

for(let i=0;i<40;i++){
  const d=document.createElement("div");
  d.className="tile";
  d.innerText=i;
  board.appendChild(d);
}

function join(){
  roomId=document.getElementById("room").value;

  socket.emit("joinRoom",{
    username:document.getElementById("username").value,
    roomId
  });

  document.getElementById("menu").style.display="none";
  document.getElementById("game").style.display="flex";
}

socket.on("gameState",s=>{
  state=s;
  render();
});

socket.on("log",l=>{
  document.getElementById("log").innerHTML=l+"<br>"+document.getElementById("log").innerHTML;
});

function render(){

  document.querySelectorAll(".player").forEach(e=>e.remove());
  playersDiv.innerHTML="";

  state.players.forEach((p,i)=>{

    playersDiv.innerHTML += `<div>${p.name} 💰${p.money}</div>`;

    const t=document.createElement("div");
    t.className="player";
    t.style.background=p.color;
    t.style.left=(i*12)+"px";

    board.children[p.pos].appendChild(t);
  });
}

function roll(){
  socket.emit("rollDice",roomId);
}

function buy(){
  socket.emit("buy",roomId);
}

</script>

</body>
</html>
