<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>City Empire Online</title>

  <script src="/socket.io/socket.io.js"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{
      background:#0f172a;
      color:white;
      padding:20px;
    }

    h1{
      text-align:center;
      margin-bottom:20px;
      color:#facc15;
    }

    .menu{
      max-width:400px;
      margin:auto;
      background:#111827;
      padding:20px;
      border-radius:20px;
    }

    input{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:10px;
    }

    button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:10px;
      background:#facc15;
      font-weight:bold;
      cursor:pointer;
    }

    .game{
      display:none;
      margin-top:20px;
      gap:20px;
      justify-content:center;
      flex-wrap:wrap;
    }

    .board{
      width:800px;
      height:800px;
      background:white;
      display:grid;
      grid-template-columns:repeat(11,1fr);
      grid-template-rows:repeat(11,1fr);
      border:8px solid #111827;
      position:relative;
    }

    .center{
      grid-column:2/11;
      grid-row:2/11;
      background:#1e3a8a;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      color:white;
    }

    .tile{
      border:1px solid black;
      background:white;
      color:black;
      font-size:10px;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      position:relative;
    }

    .player{
      width:14px;
      height:14px;
      border-radius:50%;
      position:absolute;
      bottom:2px;
    }

    .sidebar{
      width:320px;
      background:#111827;
      padding:20px;
      border-radius:20px;
    }

    .panel{
      background:#1f2937;
      padding:15px;
      border-radius:12px;
      margin-bottom:15px;
    }

    .log{
      height:250px;
      overflow-y:auto;
    }

    .log p{
      margin-bottom:6px;
    }
  </style>
</head>
<body>

<h1>🏙️ CITY EMPIRE ONLINE</h1>

<div class="menu" id="menu">
  <input type="text" id="username" placeholder="Pseudo">
  <input type="text" id="room" placeholder="Code de salle">

  <button onclick="joinGame()">REJOINDRE</button>
</div>

<div class="game" id="game">

  <div class="board" id="board">
    <div class="center">
      <h2>CITY EMPIRE</h2>
      <p>Multijoueur</p>
    </div>
  </div>

  <div class="sidebar">

    <div class="panel">
      <h3>👥 Joueurs</h3>
      <div id="players"></div>
    </div>

    <div class="panel">
      <button onclick="rollDice()">🎲 Lancer les dés</button>
    </div>

    <div class="panel">
      <h3>📜 Journal</h3>
      <div class="log" id="log"></div>
    </div>

  </div>

</div>

<script>

const socket = io();

const board = document.getElementById('board');

const properties = [];

for(let i=0;i<40;i++){
  properties.push({
    name:'Case '+(i+1)
  });
}

const tilePositions = [];

for(let i=0;i<11;i++) tilePositions.push([10,10-i]);
for(let i=1;i<11;i++) tilePositions.push([10-i,0]);
for(let i=1;i<11;i++) tilePositions.push([0,i]);
for(let i=1;i<10;i++) tilePositions.push([i,10]);

const tiles = [];

properties.forEach((property,index)=>{

  const tile = document.createElement('div');

  tile.className='tile';

  const pos = tilePositions[index];

  tile.style.gridRow = pos[0]+1;
  tile.style.gridColumn = pos[1]+1;

  tile.innerHTML = property.name;

  board.appendChild(tile);

  tiles.push(tile);
});

let gameState = null;
let roomId = null;

function joinGame(){

  const username = document.getElementById('username').value;
  roomId = document.getElementById('room').value;

  socket.emit('joinRoom',{
    username,
    roomId
  });

  document.getElementById('menu').style.display='none';
  document.getElementById('game').style.display='flex';
}

socket.on('gameState',state=>{
  gameState = state;
  render();
});

socket.on('log',message=>{
  addLog(message);
});

function render(){

  document.querySelectorAll('.player').forEach(p=>p.remove());

  const playersDiv = document.getElementById('players');
  playersDiv.innerHTML='';

  gameState.players.forEach((player,index)=>{

    const div = document.createElement('div');

    div.innerHTML = `
      ${player.username} - 💰 ${player.money}$
    `;

    playersDiv.appendChild(div);

    const token = document.createElement('div');

    token.className='player';
    token.style.background = player.color;
    token.style.right = (index*15)+'px';

    tiles[player.position].appendChild(token);
  });
}

function rollDice(){
  socket.emit('rollDice',roomId);
}

function addLog(message){

  const log = document.getElementById('log');

  const p = document.createElement('p');

  p.innerText = message;

  log.prepend(p);
}

</script>

</body>
</html>
